name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Check docker-compose.yml
        run: docker compose config --quiet

      # Only the light image is built here (seconds). The full image with the
      # real agents (PyTorch...) is built locally with `docker compose build`.
      - name: Build light image
        run: docker build --target light -t claimspilot-api .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 claimspilot-api
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
